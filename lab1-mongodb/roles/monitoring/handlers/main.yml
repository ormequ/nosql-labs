- name: Restart mongodb_exporter
  ansible.builtin.systemd:
    name: mongodb_exporter
    state: restarted
    daemon_reload: true

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Restart grafana-server
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
    daemon_reload: true
