---
# Task 7: Redis and app monitoring
# Task 8: Dashboard with metrics

- name: Monitoring system user
  ansible.builtin.user:
    name: "{{ monitoring_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  tags: [prometheus, redis_exporter]

- name: Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_user }}"
    mode: "0755"
  loop: [/etc/prometheus, /var/lib/prometheus]
  tags: [prometheus]

- name: Prometheus and redis_exporter archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/tmp/{{ item.url | basename }}"
    mode: "0644"
  loop: "{{ monitoring_binaries }}"
  tags: [prometheus, redis_exporter]

- name: Unpack prometheus and redis_exporter
  ansible.builtin.unarchive:
    src: "/tmp/{{ item.url | basename }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ item.path }}"
  loop: "{{ monitoring_binaries }}"
  tags: [prometheus, redis_exporter]

- name: Prometheus and redis_exporter binaries
  ansible.builtin.copy:
    src: "/tmp/{{ item.path }}"
    dest: "/usr/local/bin/{{ item.path | basename }}"
    mode: "0755"
    remote_src: true
  loop: "{{ monitoring_binaries }}"
  notify: [Restart prometheus, Restart redis-exporter]
  tags: [prometheus, redis_exporter]

- name: Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: "{{ monitoring_user }}"
    mode: "0644"
  notify: Restart prometheus
  tags: [prometheus]

- name: Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: Restart prometheus
  tags: [prometheus]

- name: Redis-exporter systemd unit
  ansible.builtin.template:
    src: redis-exporter.service.j2
    dest: /etc/systemd/system/redis-exporter.service
    owner: root
    group: root
    mode: "0600"
  notify: Restart redis-exporter
  tags: [redis_exporter]

# the Grafana CDN geo-blocks the lab VM's IP, so the .deb comes from GitHub releases
- name: Grafana deb from GitHub releases
  ansible.builtin.get_url:
    url: "{{ monitoring_grafana_deb_url }}"
    dest: "/tmp/{{ monitoring_grafana_deb_url | basename }}"
    mode: "0644"
  tags: [grafana]

- name: Install grafana package
  ansible.builtin.apt:
    deb: "/tmp/{{ monitoring_grafana_deb_url | basename }}"
    state: present
  notify: Restart grafana
  tags: [grafana]

- name: Grafana dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    mode: "0755"
  tags: [grafana]

- name: Grafana Prometheus datasource
  ansible.builtin.copy:
    src: grafana-datasource.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: Restart grafana
  tags: [grafana]

- name: Grafana dashboard provider
  ansible.builtin.copy:
    src: grafana-dashboard-provider.yml
    dest: /etc/grafana/provisioning/dashboards/provider.yml
    mode: "0644"
  notify: Restart grafana
  tags: [grafana]

- name: Rates dashboard JSON
  ansible.builtin.copy:
    src: rates-dashboard.json
    dest: /var/lib/grafana/dashboards/rates-dashboard.json
    mode: "0644"
  notify: Restart grafana
  tags: [grafana]

- name: Grafana config with anonymous viewer
  ansible.builtin.copy:
    src: grafana.ini
    dest: /etc/grafana/grafana.ini
    mode: "0644"
  notify: Restart grafana
  tags: [grafana]

# flush before the first start: the handler then starts each service once
- name: Apply config changes before the first start
  ansible.builtin.meta: flush_handlers
  tags: [prometheus, redis_exporter, grafana]

- name: Monitoring services enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [prometheus, redis-exporter, grafana-server]
  tags: [prometheus, redis_exporter, grafana]
